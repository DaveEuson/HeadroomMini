name: Build firmware

# Compile-checks the Yoyu firmware (ESP32-S3) on every change to
# firmware/, and attaches the built firmware.bin as an artifact so a release
# can eventually ship ready-to-flash binaries.

on:
  push:
    # Filter on branches, not tags. A `push` block carrying only `tags-ignore`
    # doesn't merely skip tags — GitHub treats a ref type you never mention as
    # excluded, so branch pushes stopped triggering this workflow entirely and
    # main went unbuilt from the day that filter was added. Naming branches
    # keeps the original intent (tag pushes belong to release.yml, which builds
    # the firmware itself) because a tag push is not a branch push.
    branches: ["**"]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Build
        working-directory: firmware
        run: pio run
      - uses: actions/upload-artifact@v7
        with:
          name: headroom-mini-firmware
          path: |
            firmware/.pio/build/headroom-mini/firmware.bin
            firmware/.pio/build/headroom-mini/bootloader.bin
            firmware/.pio/build/headroom-mini/partitions.bin
